groups:
  - name: minecraft
    rules:
      - alert: MinecraftDown
        expr: minecraft_status_healthy == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Minecraft server is down"
  - name: host
    rules:
      - alert: HighDiskUsage
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage above 85%"
      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage above 90%"
