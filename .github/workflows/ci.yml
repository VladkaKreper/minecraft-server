name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and ansible-lint
        run: pip install ansible ansible-lint

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml
        working-directory: ansible

      - name: Run ansible-lint
        run: ansible-lint
        working-directory: ansible

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from template
        run: cp docker/.env.example docker/.env

      - name: Validate compose file
        run: docker compose -f docker/docker-compose.yml config -q

      - name: Validate monitoring compose
        run: |
          cp monitoring/.env.example monitoring/.env
          docker compose -f monitoring/docker-compose.yml config -q
