- name: Install git
  ansible.builtin.apt:
    name: git
    state: present

- name: Clone repository
  ansible.builtin.git:
    repo: https://github.com/VladkaKreper/minecraft-server
    dest: /opt/minecraft
    version: master
    force: true

- name: Write .env with secrets
  ansible.builtin.copy:
    dest: /opt/minecraft/docker/.env
    content: "RCON_PASSWORD={{ rcon_password }}\n"
    mode: "0600"
  no_log: true

- name: Run docker compose
  community.docker.docker_compose_v2:
    project_src: /opt/minecraft/docker
    state: present
    pull: missing