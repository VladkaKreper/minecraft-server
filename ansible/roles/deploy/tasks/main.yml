- name: Install git
  ansible.builtin.apt:
    name: git
    state: present

- name: Clone repository
  ansible.builtin.git:
    repo: https://github.com/VladkaKreper/minecraft-server
    dest: /opt/minecraft
    version: mods_sync
    force: true

- name: Create data directory owned by the server user
  ansible.builtin.file:
    path: /opt/minecraft/docker/data
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Write .env with secrets
  ansible.builtin.copy:
    dest: /opt/minecraft/docker/.env
    content: |
      RCON_PASSWORD={{ rcon_password }}
      WEBDAV_URL={{ webdav_url }}
      WEBDAV_USER={{ webdav_user }}
      WEBDAV_PASS_OBSCURED={{ webdav_pass_obscured }}
    mode: "0600"
  no_log: true

- name: Sync mods, config and scripts from WebDAV
  ansible.builtin.command:
    cmd: docker compose run --rm -T sync
    chdir: /opt/minecraft/docker
  register: files_sync
  changed_when: (files_sync.stdout ~ files_sync.stderr) is search('Copied|Deleted')

- name: Run docker compose
  community.docker.docker_compose_v2:
    project_src: /opt/minecraft/docker
    state: present
    pull: missing

- name: Restart Minecraft if files changed
  ansible.builtin.command:
    cmd: docker compose restart mc
    chdir: /opt/minecraft/docker
  when: files_sync.changed
  changed_when: true
  
- name: Generate monitoring .env once
  ansible.builtin.copy:
    dest: /opt/minecraft/monitoring/.env
    content: |
      GRAFANA_PASSWORD={{ lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits') }}
    mode: "0600"
    force: false
  no_log: true

- name: Run monitoring stack
  community.docker.docker_compose_v2:
    project_src: /opt/minecraft/monitoring
    state: present

- name: Create alertmanager secrets directory
  ansible.builtin.file:
    path: /opt/minecraft/monitoring/alertmanager/secrets
    state: directory
    mode: "0755"

- name: Write Telegram token
  ansible.builtin.copy:
    dest: /opt/minecraft/monitoring/alertmanager/secrets/telegram_token
    content: "{{ telegram_bot_token }}"
    owner: "65534"
    group: "65534"
    mode: "0400"
  no_log: true
