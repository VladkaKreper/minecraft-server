services:
  mc:
    image: itzg/minecraft-server:java8
    container_name: mc-1710
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.7.10"
      MEMORY: "3G"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:?RCON_PASSWORD не задан}"
    volumes:
      - ./data:/data
      - ./mods:/mods:ro
    stdin_open: true
    tty: true
    restart: unless-stopped