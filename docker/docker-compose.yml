x-rclone-env: &rclone-env
   RCLONE_CONFIG_ROUTER_TYPE: webdav
   RCLONE_CONFIG_ROUTER_URL: "${WEBDAV_URL:?not set}"
   RCLONE_CONFIG_ROUTER_VENDOR: other
   RCLONE_CONFIG_ROUTER_USER: "${WEBDAV_USER:?not set}"
   RCLONE_CONFIG_ROUTER_PASS: "${WEBDAV_PASS_OBSCURED:?not set}"

services:
 mods-sync:
    image: rclone/rclone

    command: 
    - |
        set -e
        rclone sync router:/minecraft-config /config 
        rclone sync router:/minecraft-scripts /scripts 
        rclone sync router:/minecraft-mods /mods
    environment:
      <<: *rclone-env
    volumes:
      - mods:/mods
      - scripts:/scripts
      - config:/config
    restart: "no"

 mc:
    image: itzg/minecraft-server:java8
    container_name: mc-1710
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.7.10"
      MEMORY: "6G"
      REMOVE_OLD_MODS: "TRUE"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:?RCON_PASSWORD не задан}"
    volumes:
      - ./data:/data
      - mods:/mods:ro
    stdin_open: true
    tty: true
    restart: unless-stopped

 backup:
    image: itzg/mc-backup
    container_name: mc-backup
    depends_on:
      - mc
    environment:
      <<: *rclone-env
      BACKUP_METHOD: rclone
      RCLONE_REMOTE: router
      RCLONE_DEST_DIR: /minecraft-backups
      RCLONE_COMPRESS_METHOD: gzip
      RCON_HOST: mc
      RCON_PASSWORD: "${RCON_PASSWORD:?not set}"
      INITIAL_DELAY: "2m"
      BACKUP_INTERVAL: "6h"
      PRUNE_BACKUPS_DAYS: "7"
    
    volumes:
      - ./data:/data
      - backup-tmp:/backups
    stdin_open: true
    tty: true
    restart: unless-stopped
volumes:
  mods:
  scripts:
  config:
  backup-tmp:
