x-rclone-env: &rclone-env
   RCLONE_CONFIG_ROUTER_TYPE: webdav
   RCLONE_CONFIG_ROUTER_URL: "${WEBDAV_URL:?not set}"
   RCLONE_CONFIG_ROUTER_VENDOR: other
   RCLONE_CONFIG_ROUTER_USER: "${WEBDAV_USER:?not set}"
   RCLONE_CONFIG_ROUTER_PASS: "${WEBDAV_PASS_OBSCURED:?not set}"

services:
 sync:
    image: rclone/rclone
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        rm -f /data/.sync-complete
        rclone sync router:/minecraft-mods /data/mods -v --max-delete 20 --backup-dir /data/.sync-trash/mods
        rclone sync router:/minecraft-config /data/config -v
        rclone sync router:/minecraft-scripts /data/scripts -v --max-delete 20 --backup-dir /data/.sync-trash/scripts
        touch /data/.sync-complete
    environment:
      <<: *rclone-env
      HOME: /tmp
    volumes:
      - ./data:/data
    restart: "no"

 mc:
    image: itzg/minecraft-server:java8
    container_name: mc-1710
    entrypoint:
      - /bin/sh
      - -c
      - |
        until [ -f /data/.sync-complete ]; do echo "waiting for mods sync..."; sleep 2; done
        exec /image/scripts/start
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.7.10"
      MEMORY: "6G"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:?RCON_PASSWORD не задан}"
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true
    restart: unless-stopped

 backup:
    image: itzg/mc-backup
    container_name: mc-backup
    depends_on:
      - mc
    environment:
      <<: *rclone-env
      BACKUP_METHOD: rclone
      RCLONE_REMOTE: router
      RCLONE_DEST_DIR: /minecraft-backups
      RCLONE_COMPRESS_METHOD: gzip
      RCON_HOST: mc
      RCON_PASSWORD: "${RCON_PASSWORD:?not set}"
      INITIAL_DELAY: "2m"
      BACKUP_INTERVAL: "6h"
      PRUNE_BACKUPS_DAYS: "7"
    
    volumes:
      - ./data:/data:ro
      - backup-tmp:/backups
    stdin_open: true
    tty: true
    restart: unless-stopped
volumes:
  backup-tmp:
